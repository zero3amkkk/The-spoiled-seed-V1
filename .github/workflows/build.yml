
name: Build The Spoiled Seed

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle 2.14.1
        run: |
          wget https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip
          echo "$PWD/gradle-2.14.1/bin" >> $GITHUB_PATH

      - name: Extract Source
        run: |
          unzip -q TheSpoiledSeed-v0.1.0-source.zip -d source

      - name: Build Mod
        working-directory: source/TheSpoiledSeed
        run: |
          gradle setupDecompWorkspace --no-daemon
          gradle build --no-daemon

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: TheSpoiledSeed-JAR
          path: source/TheSpoiledSeed/build/libs/*.jar
          if-no-files-found: error
